<!DOCTYPE html>
<html>
<head>
    <title>Apply Leave</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f3f7ff;
        }

        .container {
            max-width: 500px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        h2 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 25px;
        }

        label {
            font-weight: 500;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #c7d2fe;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #bfdbfe;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #93c5fd;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Apply Leave</h2>

        <form method="post" action="/leave-form">
            <label>Employee Name</label>
            <input type="text" value="{{ user }}" readonly>

            <label style="margin-top:15px;">Reason</label>
            <input type="text" name="reason" required>

            <button type="submit">Submit Leave</button>
        </form>

        <div class="back">
            <a href="/">← Back to Home</a>
        </div>
    </div>
</div>

</body>
</html>
